[project]
name = "icloud-mcp"
version = "0.1.1"
description = "A Model Context Protocol server for iCloud mail and calendar, with macOS Keychain credential storage."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "eodozzy" }]
keywords = ["mcp", "icloud", "imap", "caldav", "model-context-protocol"]
# Upper bounds at the majors the code is tested on. The unit tests use fakes for
# these libraries, so a breaking major would pass CI and fail at runtime (as
# mcp 2.x did); tests/test_deps.py checks the APIs we call on the real ones.
dependencies = [
    "mcp[cli]>=1.10,<2",  # 2.x renamed FastMCP to MCPServer; port before lifting
    "imapclient>=3,<5",
    "caldav>=1.4,<4",
    "icalendar>=5,<8",  # imported directly by writes.py
    "vobject>=0.9.7,<1",
    "keyring",
    "pydantic>=2,<3",
    "python-dotenv",
]

[project.optional-dependencies]
test = ["pytest", "pytest-anyio"]

[project.scripts]
icloud-mcp = "icloud_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icloud_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
